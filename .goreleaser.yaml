version: 2

project_name: chisel

before:
  hooks:
    - go mod tidy

builds:
  - id: chisel
    main: ./cmd/chisel
    binary: chisel
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/vdemeester/chisel/internal/version.Version={{.Version}}

  - id: mallet
    main: ./cmd/mallet
    binary: mallet
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/vdemeester/chisel/internal/version.Version={{.Version}}

archives:
  - id: chisel
    builds:
      - chisel
    format: tar.gz
    name_template: "chisel_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE*

  - id: mallet
    builds:
      - mallet
    format: tar.gz
    name_template: "mallet_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: vdemeester
    name: chisel
  draft: false
  prerelease: auto
