# Tekton Bundles Resolver Example
#
# Tekton Catalog publishes tasks as OCI bundles to GitHub Container Registry (GHCR).
# Bundle reference format: ghcr.io/tektoncd/catalog/upstream/tasks/<task-name>:<version>
#
# Available tasks: https://github.com/orgs/tektoncd/packages?repo_name=catalog
# See create-test-bundle.sh for creating your own bundles in a local registry.

apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: bundles-resolver-demo
spec:
  pipelineSpec:
    tasks:
    - name: clone-from-bundle
      taskRef:
        resolver: bundles
        params:
        - name: bundle
          # Publicly available git-clone task from Tekton Catalog
          value: ghcr.io/tektoncd/catalog/upstream/tasks/git-clone:0.7
        - name: name
          value: git-clone
        - name: kind
          value: task
      params:
      - name: url
        value: https://github.com/tektoncd/pipeline
      - name: revision
        value: main
      workspaces:
      - name: output
        workspace: source

    - name: list-files
      taskSpec:
        workspaces:
        - name: source
        steps:
        - name: list
          image: alpine:3.19
          script: |
            echo "Files cloned from bundle resolver:"
            ls -la $(workspaces.source.path)
      workspaces:
      - name: source
        workspace: source
      runAfter:
      - clone-from-bundle

  workspaces:
  - name: source
    emptyDir: {}
