name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.22', '1.23']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Build
        run: go build -v ./...
      - name: Test
        run: go test -v -race ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          gofmt_out=$(gofmt -d .)
          if [[ -n "$gofmt_out" ]]; then
            echo "$gofmt_out"
            exit 1
          fi
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m
      - name: go vet
        run: go vet ./...

  integration:
    name: integration
    runs-on: ubuntu-latest
    needs: [build, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build chisel
        run: go build -o chisel ./cmd/chisel
      - name: Install Dagger
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh | BIN_DIR=$HOME/.local/bin sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Verify Dagger
        run: dagger version
      - name: Run integration tests
        run: |
          # Test dry-run parsing
          ./chisel run examples/simple/hello-task.yaml --dry-run --debug
          ./chisel run examples/simple/hello-pipeline.yaml --dry-run --debug
          ./chisel run examples/simple/hello-pipelinerun.yaml --dry-run --debug

          # Test actual execution
          ./chisel run examples/simple/hello-task.yaml --debug
          ./chisel run examples/simple/hello-pipelinerun.yaml --debug
